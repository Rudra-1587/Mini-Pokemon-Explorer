<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokéball Header</title>
   
    <link rel="stylesheet" href="./Style/style.css">

    <script>
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
</head>
<body>

    <header class="site-header">
        <!-- Logo -->
        <a href="#" class="logo">
            <svg class="pokeball-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Top Red Half -->
                <path d="M2,50 A48,48 0 0,1 98,50 Z" fill="#ff0000" stroke="#000" stroke-width="4"/>
                <!-- Bottom White Half -->
                <path d="M2,50 A48,48 0 0,0 98,50 Z" fill="#ffffff" stroke="#000" stroke-width="4"/>
                <!-- Middle Line -->
                <line x1="2" y1="50" x2="98" y2="50" stroke="#000" stroke-width="4"/>
                <!-- Outer Center Circle -->
                <circle cx="50" cy="50" r="16" fill="#ffffff" stroke="#000" stroke-width="4"/>
                <!-- Inner Center Button -->
                <circle cx="50" cy="50" r="8" fill="#ffffff" stroke="#000" stroke-width="3"/>
            </svg>
            <span>PokéDex</span>
        </a>

        <!-- Navigation -->   
        <nav class="main-nav">
        <a href="index.html" class="nav-link">Home</a>

            <div class="desktop-nav">
                <!-- Generation Dropdown -->
                <div class="nav-dropdown">
                    <button class="nav-dropdown-toggle" id="gen-toggle-desktop">
                        <span class="generation-full">Generation</span>
                        <span class="generation-short">Gen.</span>
                        <span class="dropdown-arrow">▼</span>
                    </button>
                    
                    <div class="nav-dropdown-menu" id="gen-menu-desktop">
                        <button class="dropdown-item active" data-generation="0">All generations</button>
                        <button class="dropdown-item" data-generation="1">Generation I</button>
                        <button class="dropdown-item" data-generation="2">Generation II</button>
                        <button class="dropdown-item" data-generation="3">Generation III</button>
                        <button class="dropdown-item" data-generation="4">Generation IV</button>
                        <button class="dropdown-item" data-generation="5">Generation V</button>
                        <button class="dropdown-item" data-generation="6">Generation VI</button>
                        <button class="dropdown-item" data-generation="7">Generation VII</button>
                        <button class="dropdown-item" data-generation="8">Generation VIII</button>
                        <button class="dropdown-item" data-generation="9">Generation IX</button>
                    </div>
                </div>
                
                <!-- Filter Dropdown -->
                <div class="nav-dropdown">
                    <button class="nav-dropdown-toggle" id="filter-toggle-desktop">
                        Types
                        <span class="dropdown-arrow">▼</span>
                    </button>
                    <div class="nav-dropdown-menu" id="filter-menu-desktop">
                        <button class="dropdown-item" data-type="all">All</button>
                        <button class="dropdown-item" data-type="normal">Normal</button>
                        <button class="dropdown-item" data-type="fire">Fire</button>
                        <button class="dropdown-item" data-type="water">Water</button>
                        <button class="dropdown-item" data-type="grass">Grass</button>
                        <button class="dropdown-item" data-type="electric">Electric</button>
                        <button class="dropdown-item" data-type="ice">Ice</button>
                        <button class="dropdown-item" data-type="fighting">Fighting</button>
                        <button class="dropdown-item" data-type="poison">Poison</button>
                        <button class="dropdown-item" data-type="ground">Ground</button>
                        <button class="dropdown-item" data-type="flying">Flying</button>
                        <button class="dropdown-item" data-type="psychic">Psychic</button>
                        <button class="dropdown-item" data-type="bug">Bug</button>
                        <button class="dropdown-item" data-type="rock">Rock</button>
                        <button class="dropdown-item" data-type="ghost">Ghost</button>
                        <button class="dropdown-item" data-type="dragon">Dragon</button>
                        <button class="dropdown-item" data-type="dark">Dark</button>
                        <button class="dropdown-item" data-type="steel">Steel</button>
                        <button class="dropdown-item" data-type="fairy">Fairy</button>
                    </div>
                </div>
            </div>
            
           
            <!-- Theme Toggle -->
            <label class="theme-switch" title="Toggle Dark Mode">
                <input type="checkbox" id="theme-toggle">
                <span class="slider">
                    <span class="switch-icons">
                        <span>☀️</span>
                        <span>🌙</span>
                    </span>
                </span>
            </label>
        </nav>
    </header>

        <!-- HERO / SEARCH COMPONENT -->
    <section class="hero-section">
        <div class="hero-content">
            <h1 class="hero-greeting">Hello! 👋</h1>
            <h2 class="hero-title">Welcome to the Ultimate PokéDex</h2>
            <p class="hero-description">
                Discover, explore, and learn everything about your favorite Pokémon. 
                explore all the stats, types, abilities, and evolution chains you need to become a Pokémon Master.
            </p>
            
            <!-- Search Bar -->
            <form class="search-container" id="search-form">
                <label for="pokemon-search" class="sr-only">Search Pokémon</label>
                <input type="text" id="pokemon-search" class="search-input" placeholder="Search for a Pokémon (e.g., Pikachu)...">
                <button type="submit" class="search-btn" id="search-btn">Search</button>
            </form>
        </div>
    </section>

    <!-- POKEMON CARDS GRID -->
    <section class="cards-section">
        <div class="error-container" id="error-message"> </div>
        <div class="loader-area">
            <div class="loader" id="loader"></div>
        </div>

        

        <div class="cards-container" id="pokemon-grid"></div>
    </section>

    <div class="pagination-div" id="pagination-div-js">
    </div>

    <script src="./HomePage JS/main.js" type="module"></script>
    <script src="./HomePage JS/pokemon.js" type="module"></script>
    <script src="./HomePage JS/config.js" type="module"></script>
</body>
</html>
